name: Deploy handbook

on:
  push:
    branches: main
    tags:
      - v*
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          # Pinned to the version the build is tested against locally.
          pandoc-version: '3.10.1'

      # The Ubuntu 'texlive' apt package is too old for the PDF/UA-2 tagging
      # that build.sh requests via -V pdfstandard=ua-2, so install TeX Live
      # proper. scheme-full is large but avoids chasing individual packages;
      # the action caches the installation between runs.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          version: 2026
          packages: scheme-full

      # build.sh passes --lua-filter=include-files.lua, which Pandoc resolves
      # relative to the working directory.
      - name: Download lua-filter
        run: wget https://raw.githubusercontent.com/pandoc/lua-filters/master/include-files/include-files.lua

      - name: Verify dependencies
        run: |
          pandoc --version
          lualatex --version
          ls include-files.lua

      - name: Build
        run: ./build.sh

      - name: Verify build
        run: ls -l graduate-handbook.pdf

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            graduate-handbook.pdf
